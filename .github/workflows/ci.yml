name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Toolchain
        run: clang++ --version

      - name: Build driver
        run: make all

      - name: Static tests, serialize round trip, golden replays
        run: make test

      - name: Golden replays, each pipeline
        run: |
          make golden DRIVER_ARGS="--pipeline speculative"
          make golden DRIVER_ARGS="--pipeline lookahead"
          make golden DRIVER_ARGS="--pipeline naive"

      - name: Measured tick floor on this runner
        run: |
          build/driver --calibrate --pipeline speculative
          build/driver --calibrate --pipeline lookahead

      - name: Driver log
        if: always()
        run: cat tmp/driver.log || true
